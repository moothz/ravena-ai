<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravena Intel - Dossiês & Memória</title>
    <link rel="stylesheet" href="/management.css?v=15">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .tabs-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.1em;
            font-weight: 500;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .tab-btn.active {
            color: #fff;
            background: #46249b;
            box-shadow: 0 -2px 10px rgba(70, 36, 155, 0.4);
        }
        .search-bar-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #6c35de;
        }
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .user-card:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateY(-2px);
            border-color: #6c35de;
        }
        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .user-card-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
        }
        .user-badge {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .badge-facts { background: #2b1f55; color: #b197fc; border: 1px solid #6c35de; }
        .badge-wa { background: #1b4332; color: #74c69d; }
        .badge-tg { background: #003049; color: #669bbc; }
        .user-card-meta {
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .group-section {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        .group-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .group-score {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .score-low { background: #28a745; color: white; }
        .score-medium { background: #ffc107; color: black; }
        .score-high { background: #dc3545; color: white; }
        .badge-underage { background: #e63946; color: white; margin-left: 8px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: #181920;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .modal-header {
            padding: 18px 24px;
            background: #231d38;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { font-size: 1.3em; font-weight: bold; color: #fff; }
        .modal-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.4em;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .section-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 14px 18px;
        }
        .section-title {
            font-size: 1em;
            font-weight: bold;
            color: #9d71ea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fact-pill {
            background: rgba(70, 36, 155, 0.2);
            border-left: 3px solid #6c35de;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .stat-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .stat-label { color: #888; font-size: 0.8em; margin-bottom: 4px; }
        .stat-val { font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="/android-chrome-192x192.png" alt="RavenaBot Logo">
                    <h1>Ravena Intel</h1>
                </div>
                <div class="user-info">
                    <div id="user-details">
                        <p><strong>Memória Contínua & Dossiês</strong></p>
                        <p>Ravena Memory Engine (RME)</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Navegação por Abas -->
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-users"><i class="fas fa-users"></i> Usuários & Membros</button>
                <button class="tab-btn" id="tab-groups"><i class="fas fa-building"></i> Grupos & Moderação</button>
            </div>

            <!-- Barra de Busca -->
            <div class="search-bar-container">
                <input type="text" id="global-search" class="search-input" placeholder="Buscar por número, nome, LID, ID ou tópicos...">
                <button id="refresh-btn" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Atualizar</button>
            </div>

            <!-- Loader / Erro -->
            <div id="loading-container" class="hidden">
                <div class="loading-spinner"></div>
                <p>Carregando registros da inteligência...</p>
            </div>

            <div id="error-container" class="hidden">
                <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h2>Erro ao carregar</h2>
                <p id="error-message">Detalhes do erro aqui.</p>
                <button id="retry-button" class="btn btn-primary">Tentar novamente</button>
            </div>

            <!-- Conteúdo da Aba Usuários -->
            <div id="users-view">
                <div id="users-container" class="user-grid">
                    <!-- Cards de usuários inseridos via JS -->
                </div>
            </div>

            <!-- Conteúdo da Aba Grupos -->
            <div id="groups-view" class="hidden">
                <div id="groups-container">
                    <!-- Grupos inseridos via JS -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>RavenaBot • Ravena Memory Engine (RME) • Inteligência Contínua</p>
        </footer>
    </div>

    <!-- Modal Dossiê 360 do Usuário -->
    <div id="user-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modal-user-name">Dossiê do Usuário</div>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modal-user-body">
                <!-- Conteúdo 360 preenchido via JS -->
            </div>
        </div>
    </div>

    <script src="/dossies.js"></script>
</body>
</html>
