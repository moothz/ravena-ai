<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instâncias da Ravena - Painel Administrativo</title>
    <link rel="stylesheet" href="/management.css?v=15">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 15px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
        }
        .summary-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .summary-card-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }
        .summary-card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 6px 12px;
            flex: 1;
            min-width: 200px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            margin-left: 8px;
        }
        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #bbb;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .filter-btn.active {
            background: #04a9f0;
            color: #fff;
            border-color: #04a9f0;
            font-weight: 500;
        }

        .bot-section {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.2s;
        }
        .bot-section:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .bot-section.offline {
            border-left: 4px solid #dc3545;
        }
        .bot-section.online {
            border-left: 4px solid #28a745;
        }
        .bot-section.banned {
            border-left: 4px solid #ffc107;
        }

        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
            gap: 12px;
        }
        .bot-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .bot-main-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
        }
        .bot-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-online { background: #28a745; color: #fff; }
        .badge-offline { background: #dc3545; color: #fff; }
        .badge-banned { background: #d32f2f; color: #fff; }
        .badge-private { background: #ff9800; color: #111; }
        .badge-vip { background: #9c27b0; color: #fff; }
        .badge-community { background: #00bcd4; color: #111; }
        .badge-platform { background: rgba(255, 255, 255, 0.15); color: #ddd; }
        .badge-stats { background: rgba(0, 0, 0, 0.35); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.1); }

        .bot-content {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            background: rgba(0, 0, 0, 0.25);
        }
        .bot-section.active .bot-content {
            max-height: 2500px;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .toggle-icon {
            transition: transform 0.3s;
            color: #aaa;
        }
        .bot-section.active .toggle-icon {
            transform: rotate(180deg);
            color: #04a9f0;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .detail-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 10px 14px;
        }
        .detail-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .detail-val {
            font-size: 0.95rem;
            color: #eee;
            word-break: break-word;
        }
        .detail-val a {
            color: #04a9f0;
            text-decoration: none;
        }
        .detail-val a:hover {
            text-decoration: underline;
        }

        .bot-actions-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-action:active {
            transform: translateY(0);
        }
        .btn-restart { background: #3e0ea7; color: #fff; }
        .btn-qr { background: #04a9f0; color: #fff; }
        .btn-chat { background: #25d366; color: #fff; }
        .btn-logout { background: #dc3545; color: #fff; }

        .tags-cloud {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .tag-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #aaa;
        }
        .tag-pill.active {
            color: #48bb78;
            border-color: rgba(72, 187, 120, 0.3);
            background: rgba(72, 187, 120, 0.08);
        }

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="/android-chrome-192x192.png" alt="RavenaBot Logo">
                    <h1>RavenaBot</h1>
                </div>
                <div class="user-info">
                    <div id="user-details">
                        <p><strong>Status das Instâncias</strong></p>
                        <p>Visão Geral de Todas as Ravenas</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div id="loading-container">
                <div class="loading-spinner"></div>
                <p>Carregando status das instâncias...</p>
            </div>

            <div id="error-container" class="hidden">
                <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h2>Erro ao carregar instâncias</h2>
                <p id="error-message">Detalhes do erro aqui.</p>
                <button id="retry-button" class="btn btn-primary" style="margin-top: 15px;">Tentar novamente</button>
            </div>

            <div id="dashboard-content" class="hidden">
                <!-- Sumário no topo -->
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-robot"></i> Total Bots</div>
                        <div class="summary-card-value" id="sum-total">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-check-circle" style="color:#28a745"></i> Online</div>
                        <div class="summary-card-value" id="sum-online" style="color:#28a745">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-times-circle" style="color:#dc3545"></i> Offline</div>
                        <div class="summary-card-value" id="sum-offline" style="color:#dc3545">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-lock" style="color:#ff9800"></i> Privados</div>
                        <div class="summary-card-value" id="sum-privados" style="color:#ff9800">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-users"></i> Grupos Totais</div>
                        <div class="summary-card-value" id="sum-groups">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-label"><i class="fas fa-bolt" style="color:#04a9f0"></i> Msgs/Hora</div>
                        <div class="summary-card-value" id="sum-msgs" style="color:#04a9f0">0</div>
                    </div>
                </div>

                <!-- Barra de controles, busca e filtros -->
                <div class="controls-bar">
                    <div class="search-box">
                        <i class="fas fa-search" style="color:#888"></i>
                        <input type="text" id="searchInput" placeholder="Filtrar por nome, ID ou número...">
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">Todos</button>
                        <button class="filter-btn" data-filter="online">Online</button>
                        <button class="filter-btn" data-filter="offline">Offline</button>
                        <button class="filter-btn" data-filter="private">Privados</button>
                        <button class="filter-btn" data-filter="whatsapp">WhatsApp</button>
                        <button class="filter-btn" data-filter="telegram">Telegram</button>
                        <button class="filter-btn" data-filter="discord">Discord</button>
                    </div>
                    <div class="refresh-info">
                        <button id="refresh-button" class="btn-action" style="background:rgba(255,255,255,0.1); color:#fff; padding:5px 10px;">
                            <i class="fas fa-sync-alt" id="refresh-icon"></i> Atualizar
                        </button>
                        <span id="last-updated-text">Atualizado agora</span>
                    </div>
                </div>

                <!-- Lista de instâncias -->
                <div id="instances-container">
                    <!-- Cards gerados via JS -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>RavenaBot &mdash; Monitor de Instâncias e Diagnóstico</p>
        </footer>
    </div>

    <script src="/instances.js"></script>
</body>
</html>
