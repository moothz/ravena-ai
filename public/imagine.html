<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Imagens - RavenaBot</title>
    
    <meta name="description" content="Gere imagens incríveis com a RavenaBot!">
    <meta name="author" content="moothz">
    
    <link rel="stylesheet" href="/cmd.css?v=2">
    <link rel="stylesheet" href="/ajuda.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary-color: #04a9f0;
            --background-color: #05060d;
            --surface-color: #111420;
            --card-color: #1a1d2e;
            --text-color: #b7b7c5;
            --text-highlight: #ffffff;
            --border-color: #2f304d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
        }

        .imagine-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 30px;
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        .input-section {
            border: 2px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.02);
            transition: border-color 0.3s;
        }

        .input-section:focus-within {
            border-color: var(--primary-color);
        }

        #prompt-input {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            color: var(--text-highlight);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-color);
            margin-top: 10px;
        }

        .output-section {
            display: none;
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            text-align: center;
        }

        h3 {
            color: var(--text-highlight);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-image-container {
            width: 100%;
            max-width: 512px;
            margin: 0 auto 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: #0d0e14;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-image {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .placeholder-icon {
            font-size: 4rem;
            color: var(--border-color);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            background: #0388c2;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #2d3748;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #2d3748;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .status-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            background: rgba(4, 169, 240, 0.1);
            color: var(--primary-color);
            font-size: 0.95rem;
            border: 1px solid rgba(4, 169, 240, 0.2);
            text-align: center;
        }

        #offline-message {
            margin-top: 10px;
        }

        .loading-spinner {
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="/android-chrome-192x192.png" alt="RavenaBot Logo">
                <h1>RavenaBot</h1>
            </div>
            <div class="header-title">
                Gerar Imagem (Imagine)
            </div>
        </header>

        <main class="main-content">
            <div class="imagine-container">
                <div class="input-section">
                    <h3>O que você quer criar?</h3>
                    <textarea id="prompt-input" maxlength="1000" placeholder="Ex: Um astronauta andando a cavalo em Marte, estilo cyberpunk..."></textarea>
                    <div class="char-count"><span id="current-chars">0</span>/1000</div>
                </div>

                <div id="offline-message" class="status-container" style="background: rgba(221, 107, 32, 0.1); color: #ed8936; border: 1px solid rgba(221, 107, 32, 0.3);">
                    <i class="fas fa-exclamation-triangle"></i> Serviço indisponível no momento
                </div>

                <div class="action-buttons">
                    <button id="generate-btn" class="btn btn-primary" disabled>
                        <i class="fas fa-magic"></i> Iniciar Geração
                    </button>
                </div>

                <div id="status-box" class="status-container">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <span id="status-text">Aguardando...</span>
                </div>

                <div class="output-section" id="result-section">
                    <h3><i class="fas fa-image"></i> Resultado</h3>
                    <div class="result-image-container">
                        <i class="fas fa-image placeholder-icon" id="placeholder-icon"></i>
                        <img id="result-image" alt="Imagem Gerada">
                    </div>
                    <div class="action-buttons">
                        <a id="download-btn" class="btn btn-primary" download="ravena-image.jpg">
                            <i class="fas fa-download"></i> Baixar Imagem
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p class="copyright">RavenaBot © 2026 • v1.2</p>
        </footer>
    </div>

    <script src="/imagine.js?v=1"></script>
</body>
</html>
