<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="rb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0b5a"/>
      <stop offset="100%" stop-color="#11052c"/>
    </linearGradient>
    <linearGradient id="rb-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#04a9f0"/>
    </linearGradient>
    <linearGradient id="rb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="rb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#rb-bg)" stroke="#a855f7" stroke-width="2"/>
  <!-- Pediment / Roof -->
  <polygon points="48,18 76,34 20,34" fill="none" stroke="url(#rb-cyan)" stroke-width="3.5" stroke-linejoin="round" filter="url(#rb-glow)"/>
  <circle cx="48" cy="27.5" r="2.8" fill="url(#rb-gold)"/>
  <!-- Entablature & Base -->
  <line x1="22" y1="39" x2="74" y2="39" stroke="url(#rb-cyan)" stroke-width="3" stroke-linecap="round"/>
  <rect x="20" y="67" width="56" height="5" rx="2" fill="url(#rb-cyan)" filter="url(#rb-glow)"/>
  <rect x="16" y="74" width="64" height="5" rx="2" fill="#7000ff" stroke="url(#rb-cyan)" stroke-width="1.5"/>
  <!-- Bank Pillars -->
  <rect x="25" y="42" width="7" height="23" rx="2" fill="url(#rb-cyan)" opacity="0.9"/>
  <rect x="44.5" y="42" width="7" height="23" rx="2" fill="url(#rb-cyan)" opacity="0.9"/>
  <rect x="64" y="42" width="7" height="23" rx="2" fill="url(#rb-cyan)" opacity="0.9"/>
  <!-- Gold Rune Coin Badge -->
  <circle cx="67" cy="63" r="14" fill="#140836" stroke="url(#rb-gold)" stroke-width="2.5" filter="url(#rb-glow)"/>
  <path d="M63,55 L63,71 M63,55 L70,58.5 L63,62.5 L71,71" fill="none" stroke="url(#rb-gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
