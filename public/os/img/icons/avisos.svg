<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg-avisos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1424"/>
      <stop offset="100%" stop-color="#14061a"/>
    </linearGradient>
    <linearGradient id="bullhorn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow-avisos" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#bg-avisos)" stroke="#ff007f" stroke-width="2"/>
  <!-- Megafone / Bullhorn -->
  <g filter="url(#glow-avisos)">
    <!-- Corpo do megafone -->
    <path d="M 24 38 L 40 38 L 62 26 L 62 68 L 40 56 L 24 56 Z" fill="url(#bullhorn-grad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <!-- Alça do megafone -->
    <path d="M 32 56 L 32 70 L 40 70 L 40 56" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ondas de som -->
    <path d="M 70 36 C 75 42 75 52 70 58" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 77 30 C 85 40 85 54 77 64" fill="none" stroke="#ff007f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
