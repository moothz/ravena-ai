<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Ravena Admin</title>
		<link rel="icon" href="/favicon-32x32.png" type="image/png" />
		<!-- Aplica o tema antes da primeira pintura: ?theme= (validado) ou o salvo no navegador. -->
		<script>
			(function () {
				var ok = { light: 1, dark: 1 };
				var t = null;
				try {
					t = new URLSearchParams(location.search).get("theme");
				} catch (e) {}
				if (!ok[t]) {
					try {
						t = localStorage.getItem("ravena-admin-theme");
					} catch (e) {}
				}
				if (ok[t]) document.documentElement.dataset.theme = t;
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
		/>
		<link rel="stylesheet" href="/admin/tokens.css?v=1" />
		<link rel="stylesheet" href="/admin/admin.css?v=1" />
	</head>
	<body>
		<a class="skip" href="#main">Pular para o conteúdo</a>

		<header class="topbar">
			<a class="brand" href="#/geral" aria-label="Ravena Admin, visão geral">
				<span class="brand-mark" aria-hidden="true"></span>
				<span class="brand-name">Ravena</span>
				<span class="brand-sub">admin</span>
			</a>
			<span class="topbar-sep" aria-hidden="true"></span>
			<span class="topbar-summary" id="topbar-summary" aria-live="polite"></span>
			<span class="spacer"></span>
			<div class="seg seg-theme" id="theme-switch" role="group" aria-label="Tema">
				<button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
				<button type="button" data-theme-choice="light" aria-pressed="false">Claro</button>
				<button type="button" data-theme-choice="dark" aria-pressed="false">Escuro</button>
			</div>
			<button type="button" class="btn btn-quiet theme-cycle" id="theme-cycle">Tema: Auto</button>
			<a class="btn btn-quiet" href="/logout">Sair</a>
		</header>
		<div class="banner" id="session-banner" role="alert" hidden>
			<span class="status"><span class="lamp" data-state="down" aria-hidden="true"></span></span>
			<span>A sessão de admin expirou.</span>
			<a class="btn" href="/admin">Entrar de novo</a>
		</div>

		<div class="shell">
			<nav class="sidebar" id="sidebar" aria-label="Áreas do painel"></nav>
			<main class="main" id="main" tabindex="-1"></main>
		</div>

		<!-- Celular: as áreas fora da barra inferior, o tema e o Sair. -->
		<dialog class="sheet" id="more-sheet" aria-labelledby="more-title">
			<div class="sheet-body">
				<p class="label" id="more-title">Mais áreas</p>
				<ul class="sheet-areas"></ul>
				<div class="sheet-actions">
					<button type="button" class="btn" id="theme-cycle-sheet">Tema: Auto</button>
					<a class="btn" href="/logout">Sair</a>
					<form method="dialog"><button class="btn btn-quiet" type="submit">Fechar</button></form>
				</div>
			</div>
		</dialog>

		<script src="/admin/admin.js?v=1"></script>
	</body>
</html>
