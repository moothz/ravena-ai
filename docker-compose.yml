x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:

  # ───────────────────────────────────────────────────────────
  # postgres — Database (whatsgoapi + ravena-ai backups)
  # Internal only
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsgo_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsgo} -d ${POSTGRES_DB:-whatsgo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────
  # minio — Object Storage for media files (whatsgoapi)
  # Internal only
  # ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────
  # rembg — Background Removal API (Python / rembg)
  # Internal only
  # ───────────────────────────────────────────────────────────
  rembg:
    image: danielgatis/rembg
    container_name: rembg
    restart: unless-stopped
    logging: *default-logging
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    command: s --port 7000

  # ───────────────────────────────────────────────────────────
  # whatsgoapi — WhatsApp REST API (Go / whatsmeow)
  # Internal only: not exposed to host
  # ───────────────────────────────────────────────────────────
  whatsgoapi:
    build:
      context: ./whatsgoapi
      dockerfile: Dockerfile
    container_name: whatsgoapi
    env_file: .env
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${WHATSGOAPI_PORT:-9800}:${SERVER_PORT:-8080}"
    networks:
      - ravena-net
    volumes:
      # Persistent: media files, SQLite DB, logs
      - ./data/whatsgoapi/files:/app/files
      - ./data/whatsgoapi/logs:/app/logs
      - ./data/whatsgoapi/dbdata:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────
  # ravena-ai — Main WhatsApp Bot (Node.js)
  # Exposes BotAPI port to host
  # ───────────────────────────────────────────────────────────
  ravena-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravena-ai
    env_file: .env
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-5001}:${API_PORT:-5001}"
      - "${TELEGRAM_WEBHOOK_PORT:-9005}:${TELEGRAM_WEBHOOK_PORT:-9005}"
    volumes:
      # Persistent data — NEVER reset these
      - ./data:/app/data
      - ./public:/app/public
      - ./logs:/app/logs
      # DL_FOLDER: maps the host path you set in .env to the fixed internal path
      - ${DL_FOLDER}:/app/downloads
      # Config files — edit on host and restart the container to apply changes (no rebuild needed)
      - ./bots.json:/app/bots.json
      - ./service-providers.json:/app/service-providers.json
      # Code mounts — uncomment for instant development updates without rebuilds (use 'make restart-bot' to apply changes)
      # - ./index.js:/app/index.js
      # - ./src:/app/src
    depends_on:
      whatsgoapi:
        condition: service_started
      rembg:
        condition: service_started
      cobalt:
        condition: service_started


  # ───────────────────────────────────────────────────────────
  # health-check — Monitors whatsgoapi and ravena-ai
  # Restarts containers via Docker socket if they go offline
  # ───────────────────────────────────────────────────────────
  health-check:
    image: alpine:3.20
    container_name: health-check
    restart: unless-stopped
    logging: *default-logging
    pid: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      HEALTH_CHECK_TELEGRAM_BOT_TOKEN: ${HEALTH_CHECK_TELEGRAM_BOT_TOKEN:-}
      HEALTH_CHECK_TELEGRAM_CHAT_ID: ${HEALTH_CHECK_TELEGRAM_CHAT_ID:-}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}
      SERVER_PORT: ${SERVER_PORT:-8080}
      API_PORT: ${API_PORT:-5001}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-60}
    volumes:
      - ./check-health.sh:/check-health.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./:/app:ro
    entrypoint: >
      sh -c "apk add --no-cache curl jq docker-cli procps && sh /check-health.sh"
    depends_on:
      - whatsgoapi
      - ravena-ai

  # ───────────────────────────────────────────────────────────
  # cobalt — Media Downloader API
  # ───────────────────────────────────────────────────────────
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ravena-net
    ports:
      - "${COBALT_PORT:-9090}:9000"
    environment:
      - API_URL=http://cobalt:9000/
      - API_NAME=Ravena-Cobalt
      - COOKIE_PATH=/app/cookies.json
      - FORCE_LOCAL_PROCESSING=always
      - CORS_WILDCARD=1
    volumes:
      - ./data/www.youtube.com_cookies.json:/app/cookies.json

# ─────────────────────────────────────────────────────────────
# VOLUMES — persistent storage
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:

# ─────────────────────────────────────────────────────────────
# NETWORKS — all services communicate internally
# ─────────────────────────────────────────────────────────────
networks:
  ravena-net:
    driver: bridge
