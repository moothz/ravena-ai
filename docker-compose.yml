x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:

  # ───────────────────────────────────────────────────────────
  # postgres — Database (whatsgoapi + ravena-ai backups)
  # Internal only
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsgo_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsgo} -d ${POSTGRES_DB:-whatsgo_db}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────
  # rustfs — Object Storage S3 para mídia (whatsgoapi)
  # Substitui o MinIO (imagens minio/minio e minio/mc saíram do Docker Hub)
  # Internal only
  # ───────────────────────────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: rustfs
    restart: unless-stopped
    logging: *default-logging
    networks:
      ravena-net:
        # alias 'minio' mantido para retrocompatibilidade: a whatsgoapi (Go) usa MINIO_ENDPOINT=minio:9000 hardcoded
        aliases:
          - minio
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ravenaadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${RUSTFS_DATA_PATH:-./data/rustfs}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────
  # rembg — Background Removal API (Python / rembg)
  # Internal only
  # ───────────────────────────────────────────────────────────
  rembg:
    image: danielgatis/rembg
    container_name: rembg
    restart: unless-stopped
    logging: *default-logging
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    command: s --port 7000

  # ───────────────────────────────────────────────────────────
  # whatsgoapi — WhatsApp REST API (Go / whatsmeow)
  # Internal only: not exposed to host
  # ───────────────────────────────────────────────────────────
  whatsgoapi:
    build:
      context: ./whatsgoapi
      dockerfile: Dockerfile
    container_name: whatsgoapi
    env_file: .env
    environment:
      # Mapeamento de retrocompatibilidade para que a WhatsGoAPI continue funcionando sem rebuild imediato
      - MINIO_ENABLED=${S3_ENABLED:-true}
      - MINIO_ENDPOINT=${S3_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY}
      - MINIO_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_BUCKET=${S3_BUCKET_MEDIA:-${S3_BUCKET:-zap-media}}
      - MINIO_USE_SSL=${S3_USE_SSL:-false}
      - MINIO_REGION=${S3_REGION:-}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${WHATSGOAPI_PORT:-9800}:${SERVER_PORT:-8080}"
    networks:
      - ravena-net
    volumes:
      # Persistent: media files, SQLite DB, logs
      - ./data/whatsgoapi/files:/app/files
      - ./data/whatsgoapi/logs:/app/logs
      - ./data/whatsgoapi/dbdata:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────
  # ravena-ai — Main WhatsApp Bot (Node.js)
  # Exposes BotAPI port to host
  # ───────────────────────────────────────────────────────────
  ravena-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravena-ai
    env_file: .env
    environment:
      - DL_FOLDER=/app/downloads
      - PRIMARY_BACKUP_PATH=/app/downloads/backups/sqlite
      - BACKUP_TO_FS=${BACKUP_TO_FS:-false}
      - BACKUP_TO_S3=${BACKUP_TO_S3:-true}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-5001}:${API_PORT:-5001}"
      - "${TELEGRAM_WEBHOOK_PORT:-9005}:${TELEGRAM_WEBHOOK_PORT:-9005}"
    volumes:
      # Persistent data — NEVER reset these
      - ./data:/app/data
      - ./public:/app/public
      - ./logs:/app/logs
      - ./temp:/app/temp
      # DL_FOLDER: maps the host path you set in .env to the fixed internal path
      - ${DL_FOLDER}:/app/downloads
      # Stickers Lovecell: HD secundário mapeado de forma transparente para o cache interno
      - ${LOVECELL_STICKERS_FOLDER:-/mnt/ks500gb/stickers}:/app/data/media/lovecell
      # Config files — edit on host and restart the container to apply changes (no rebuild needed)
      - ./bots.json:/app/bots.json
      - ./service-providers.json:/app/service-providers.json
      # Code mounts — uncomment for instant development updates without rebuilds (use 'make restart-bot' to apply changes)
      # - ./index.js:/app/index.js
      # - ./src:/app/src
    depends_on:
      whatsgoapi:
        condition: service_started
      rembg:
        condition: service_started
      cobalt:
        condition: service_started


  # ───────────────────────────────────────────────────────────
  # health-check — Monitors whatsgoapi and ravena-ai
  # Restarts containers via Docker socket if they go offline
  # ───────────────────────────────────────────────────────────
  health-check:
    image: alpine:3.20
    container_name: health-check
    restart: unless-stopped
    logging: *default-logging
    pid: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      HEALTH_CHECK_TELEGRAM_BOT_TOKEN: ${HEALTH_CHECK_TELEGRAM_BOT_TOKEN:-}
      HEALTH_CHECK_TELEGRAM_CHAT_ID: ${HEALTH_CHECK_TELEGRAM_CHAT_ID:-}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}
      SERVER_PORT: ${SERVER_PORT:-8080}
      API_PORT: ${API_PORT:-5001}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-60}
      # Disk monitoring
      HEALTH_CHECK_DISK_CRITICAL: ${HEALTH_CHECK_DISK_CRITICAL:-95}
      HEALTH_CHECK_DISK_RECOVER: ${HEALTH_CHECK_DISK_RECOVER:-90}
      HEALTH_CHECK_DISK_MONITOR_INTERVAL: ${HEALTH_CHECK_DISK_MONITOR_INTERVAL:-120}
      HEALTH_CHECK_DISK_MOUNT: ${HEALTH_CHECK_DISK_MOUNT:-/}
      # Secondary disk monitoring (warning only at 85%)
      HEALTH_CHECK_DISK_SEC_WARN: ${HEALTH_CHECK_DISK_SEC_WARN:-85}
      HEALTH_CHECK_DISK_SEC_RECOVER: ${HEALTH_CHECK_DISK_SEC_RECOVER:-80}
      HEALTH_CHECK_DISK_SEC_MOUNT: "/mnt/secondary-disk"
      # WhatsApp notification (uses the internal whatsgoapi)
      HEALTH_CHECK_WA_BOT_INSTANCE: ${HEALTH_CHECK_WA_BOT_INSTANCE:-ravenavip}
      HEALTH_CHECK_WA_GROUP: ${HEALTH_CHECK_WA_GROUP:-${GRUPO_ANUNCIOS:-}}
    volumes:
      - ./scripts/check-health.sh:/check-health.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./:/app:ro
      - ${SECONDARY_STORAGE_PATH:-./data}:/mnt/secondary-disk:ro
    entrypoint: >
      sh -c "apk add --no-cache curl jq docker-cli procps && sh /check-health.sh"
    depends_on:
      - whatsgoapi
      - ravena-ai

  # ───────────────────────────────────────────────────────────
  # cobalt — Media Downloader API
  # ───────────────────────────────────────────────────────────
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ravena-net
    ports:
      - "${COBALT_PORT:-9090}:9000"
    environment:
      - API_URL=http://cobalt:9000/
      - API_NAME=Ravena-Cobalt
      - COOKIE_PATH=/app/cookies.json
      - FORCE_LOCAL_PROCESSING=always
      - CORS_WILDCARD=1
    volumes:
      - ./data/www.youtube.com_cookies.json:/app/cookies.json

# ─────────────────────────────────────────────────────────────
# VOLUMES — persistent storage
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:

# ─────────────────────────────────────────────────────────────
# NETWORKS — all services communicate internally
# ─────────────────────────────────────────────────────────────
networks:
  ravena-net:
    driver: bridge
