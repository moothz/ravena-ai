services:

  # ───────────────────────────────────────────────────────────
  # postgres — Database (wuzapi + ravena-ai backups)
  # Internal only
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wuzapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wuzapi_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wuzapi} -d ${POSTGRES_DB:-wuzapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────
  # minio — Object Storage for media files (wuzapi)
  # Internal only
  # ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────
  # rembg — Background Removal API (Python / rembg)
  # Internal only
  # ───────────────────────────────────────────────────────────
  rembg:
    image: danielgatis/rembg
    container_name: rembg
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    command: s --port 7000

  # ───────────────────────────────────────────────────────────
  # wuzapi — WhatsApp REST API (Go / whatsmeow)
  # Internal only: not exposed to host
  # ───────────────────────────────────────────────────────────
  wuzapi:
    image: asternic/wuzapi:latest
    container_name: wuzapi
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${WUZAPI_PORT:-9810}:8080"
    networks:
      - ravena-net
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-wuzapi}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-wuzapi_db}
      # Admin
      ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      # Webhook (global)
      WEBHOOK_URL: ${WUZAPI_GLOBAL_WEBHOOK}
      WEBHOOK_FORMAT: json
      # S3 / MinIO
      S3_ENABLED: "true"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${MINIO_BUCKET:-zap-media}
      S3_USE_SSL: "false"
      S3_REGION: ${MINIO_REGION:-}
      # Media delivery: base64 + S3 URL
      MEDIA_DELIVERY: both
      # Behavior
      CONNECT_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────
  # ravena-ai — Main WhatsApp Bot (Node.js)
  # Exposes BotAPI port to host
  # ───────────────────────────────────────────────────────────
  ravena-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravena-ai
    env_file: .env
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    ports:
      - "${API_PORT:-5000}:5000"
      - "${TELEGRAM_WEBHOOK_PORT:-9005}:${TELEGRAM_WEBHOOK_PORT:-9005}"
    volumes:
      # Persistent data — NEVER reset these
      - ./data:/app/data
      - ./public:/app/public
      # DL_FOLDER: maps the host path you set in .env to the fixed internal path
      - ${DL_FOLDER}:/app/downloads
      # Config files — edit on host and restart the container to apply changes (no rebuild needed)
      - ./bots.json:/app/bots.json
      - ./service-providers.json:/app/service-providers.json
    depends_on:
      wuzapi:
        condition: service_started

  # ───────────────────────────────────────────────────────────
  # health-check — Monitors wuzapi and ravena-ai
  # Restarts containers via Docker socket if they go offline
  # ───────────────────────────────────────────────────────────
  health-check:
    image: alpine:3.20
    container_name: health-check
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      HEALTH_CHECK_TELEGRAM_BOT_TOKEN: ${HEALTH_CHECK_TELEGRAM_BOT_TOKEN:-}
      HEALTH_CHECK_TELEGRAM_CHAT_ID: ${HEALTH_CHECK_TELEGRAM_CHAT_ID:-}
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      WUZAPI_URL: http://wuzapi:8080
      API_PORT: ${API_PORT:-5000}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-60}
    volumes:
      - ./check-health.sh:/check-health.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "apk add --no-cache curl jq docker-cli && sh /check-health.sh"
    depends_on:
      - wuzapi
      - ravena-ai

  # ───────────────────────────────────────────────────────────
  # cobalt — Media Downloader API
  # ───────────────────────────────────────────────────────────
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    networks:
      - ravena-net
    ports:
      - "${COBALT_PORT:-9090}:9000"
    environment:
      - API_URL=http://cobalt:9000/
      - API_NAME=Ravena-Cobalt
      - COOKIE_PATH=/app/cookies.json
      - FORCE_LOCAL_PROCESSING=always
      - CORS_WILDCARD=1
    volumes:
      - ./data/www.youtube.com_cookies.json:/app/cookies.json

# ─────────────────────────────────────────────────────────────
# VOLUMES — persistent storage
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:

# ─────────────────────────────────────────────────────────────
# NETWORKS — all services communicate internally
# ─────────────────────────────────────────────────────────────
networks:
  ravena-net:
    driver: bridge