services:

  # ───────────────────────────────────────────────────────────
  # postgres — Database (whatsgoapi + ravena-ai backups)
  # Internal only
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsgo_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsgo} -d ${POSTGRES_DB:-whatsgo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────
  # minio — Object Storage for media files (whatsgoapi)
  # Internal only
  # ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────
  # rembg — Background Removal API (Python / rembg)
  # Internal only
  # ───────────────────────────────────────────────────────────
  rembg:
    image: danielgatis/rembg
    container_name: rembg
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    command: s --port 7000

  # ───────────────────────────────────────────────────────────
  # whatsgoapi — WhatsApp REST API (Go / whatsmeow)
  # Internal only: not exposed to host
  # ───────────────────────────────────────────────────────────
  whatsgoapi:
    build:
      context: ./whatsgoapi
      dockerfile: Dockerfile
    container_name: whatsgoapi
    env_file: .env
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${WHATSGOAPI_PORT:-9800}:${SERVER_PORT:-8080}"
    networks:
      - ravena-net
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT:-8080}

      # Authentication
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}

      # PostgreSQL (populated by compose from .env)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-whatsgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whatsgo_db}
      DATABASE_SAVE_MESSAGES: ${DATABASE_SAVE_MESSAGES:-false}

      # Behavior
      CLIENT_NAME: ${CLIENT_NAME:-ravenawhats}
      OS_NAME: ${OS_NAME:-Ravena WhatsGo}
      CONNECT_ON_STARTUP: ${CONNECT_ON_STARTUP:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOKFILES: ${WEBHOOKFILES:-true}
      WADEBUG: ${WADEBUG:-}
      LOGTYPE: ${LOGTYPE:-console}

      # MinIO
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-zap-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # Logs
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-100}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-5}
      LOG_MAX_AGE: ${LOG_MAX_AGE:-30}
      LOG_DIRECTORY: /app/logs
      LOG_COMPRESS: ${LOG_COMPRESS:-true}
    volumes:
      # Persistent: media files, SQLite DB, logs
      - ./data/whatsgoapi/files:/app/files
      - ./data/whatsgoapi/logs:/app/logs
      - ./data/whatsgoapi/dbdata:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────
  # ravena-ai — Main WhatsApp Bot (Node.js)
  # Exposes BotAPI port to host
  # ───────────────────────────────────────────────────────────
  ravena-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravena-ai
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    ports:
      - "${API_PORT:-5000}:5000"
      - "${TELEGRAM_WEBHOOK_PORT:-9005}:${TELEGRAM_WEBHOOK_PORT:-9005}"
    env_file: .env
    volumes:
      # Persistent data — NEVER reset these
      - ./data:/app/data
      - ./public:/app/public
      # DL_FOLDER: maps the host path you set in .env to the fixed internal path
      - ${DL_FOLDER}:/app/downloads
      # Config files — edit on host and restart the container to apply changes (no rebuild needed)
      - ./bots.json:/app/bots.json
      - ./service-providers.json:/app/service-providers.json
    depends_on:
      whatsgoapi:
        condition: service_started


  # ───────────────────────────────────────────────────────────
  # health-check — Monitors whatsgoapi and ravena-ai
  # Restarts containers via Docker socket if they go offline
  # ───────────────────────────────────────────────────────────
  health-check:
    image: alpine:3.20
    container_name: health-check
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ravena-net
    environment:
      HEALTH_CHECK_TELEGRAM_BOT_TOKEN: ${HEALTH_CHECK_TELEGRAM_BOT_TOKEN:-}
      HEALTH_CHECK_TELEGRAM_CHAT_ID: ${HEALTH_CHECK_TELEGRAM_CHAT_ID:-}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}
      SERVER_PORT: ${SERVER_PORT:-8080}
      API_PORT: ${API_PORT:-5000}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-60}
    volumes:
      - ./check-health.sh:/check-health.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "apk add --no-cache curl jq docker-cli && sh /check-health.sh"
    depends_on:
      - whatsgoapi
      - ravena-ai

  # ───────────────────────────────────────────────────────────
  # cobalt — Media Downloader API
  # ───────────────────────────────────────────────────────────
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    networks:
      - ravena-net
    ports:
      - "${COBALT_PORT:-9090}:9000"
    environment:
      - API_URL=http://cobalt:9000/
      - API_NAME=Ravena-Cobalt
      - COOKIE_PATH=/app/cookies.json
      - FORCE_LOCAL_PROCESSING=always
      - CORS_WILDCARD=1
    volumes:
      - ./data/www.youtube.com_cookies.json:/app/cookies.json

# ─────────────────────────────────────────────────────────────
# VOLUMES — persistent storage
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:

# ─────────────────────────────────────────────────────────────
# NETWORKS — all services communicate internally
# ─────────────────────────────────────────────────────────────
networks:
  ravena-net:
    driver: bridge
