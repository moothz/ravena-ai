# Gerado junto com os dashboards da economia. Regras do painel da economia (pasta Economia), sem ponto de contato:
# aparecem em Alerting e no painel 'Alertas da economia'. Para receber aviso, configurar um contact point no Grafana.
{
 "apiVersion": 1,
